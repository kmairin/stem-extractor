[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitwave"
version = "0.1.0"
description = "High-quality vocal / instrument separation engine (CLI + server) for Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kmairin" }]
keywords = ["audio", "source-separation", "stems", "vocals", "demucs", "roformer"]

# Core deps are intentionally light so `import splitwave` and the pure-logic
# layers (tiers, chunker, config, registry) work without the heavy ML stack.
# Inference backends live in the [ml]/[mlx] extras and are imported lazily.
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Default inference backend: UVR-derived audio-separator (ONNX + CoreML EP).
ml = [
    "audio-separator>=0.18",
    "onnxruntime>=1.17",
    "demucs>=4.0",
    "torch>=2.2",
]
# Apple-Silicon-native MLX backend (opt-in, lowest latency on M-series).
mlx = ["mlx-audio-separator"]
# FastAPI service + job queue (Track C).
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
]
# Eval / QA harness (Track F).
eval = ["museval>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
splitwave = "splitwave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/splitwave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
